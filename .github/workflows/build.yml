name: Build mod jar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: sword-of-rupture-jar
          path: build/libs/*.jar
      - name: Publish jar (latest + versioned backup)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar --title "v$VER (${GITHUB_SHA::7})" --notes "Автосборка из коммита ${GITHUB_SHA::7}" --latest
          # Бэкап версии: свой тег и релиз v$VER (пересоздаётся при новых сборках той же версии)
          gh release delete "v$VER" --yes --cleanup-tag || true
          NOTES=$(awk "/^## $VER/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          gh release create "v$VER" build/libs/*.jar --target "$GITHUB_SHA" --title "v$VER" --notes "${NOTES:-Версия $VER}" --latest=false
          # Храним бинарники текущей и двух предыдущих версий; теги (исходники) не удаляем
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^v[0-9]' | sort -V -r | tail -n +4 \
            | while read -r t; do gh release delete "$t" --yes || true; done
